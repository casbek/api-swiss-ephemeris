# nginx site for the Swiss Ephemeris API.
#
# The Go service listens on loopback and has no TLS of its own. nginx
# terminates TLS, applies a rate limit and passes requests through.

# A shared zone for rate limiting by client address. 10 MB tracks roughly
# 160,000 addresses.
limit_req_zone $binary_remote_addr zone=swisseph_api:10m rate=20r/s;

# Reuse the client's request id when it sent one, so a trace started upstream
# stays intact, and fall back to nginx's own for everything else. nginx's
# $request_id is always freshly generated and would otherwise discard the
# client's.
map $http_x_request_id $swisseph_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream swisseph_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Requests are small JSON objects; the service caps bodies itself, and
    # this rejects oversized ones before they reach it.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Health checks should not be rate limited, or a probe can be throttled
    # out and the instance declared dead.
    location = /health {
        proxy_pass http://swisseph_api;
        access_log off;
    }

    location / {
        limit_req zone=swisseph_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://swisseph_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the request id through so the log lines on both sides can be
        # matched up.
        proxy_set_header X-Request-Id $swisseph_request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
